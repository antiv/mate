name: Release

# Publishing was manual, so it stopped happening: the CHANGELOG reached 1.0.9 while
# GitHub still showed only v1.0.0. Pushing a tag is now the whole ritual.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  discussions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, to tell whether this one is the newest

      # A patch for an older minor (v1.5.1 from release/1.5 after v2.0.0) must not take
      # "latest" from the newest release. Only final vX.Y.Z tags count.
      - name: Is this the newest release?
        id: newest
        run: |
          newest=$(git tag -l 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME, newest release tag $newest: latest=$latest"

      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section for [$version] — add one before tagging." >&2
            exit 1
          fi

      # gh is preinstalled on the runner, so the release needs no third-party action.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --latest="${{ steps.newest.outputs.latest }}"

          # Open an Announcements thread so a release has somewhere to be replied
          # to instead of being a one-way changelog post. Deliberately a separate,
          # non-fatal step: a renamed or missing category should not fail a release
          # that has already published correctly.
          gh release edit "$GITHUB_REF_NAME" --discussion-category "Announcements" \
            || echo "::warning::Could not open a release discussion. Check that an 'Announcements' category exists. The release itself is published."
