name: Docker image

# Publishes the image to ghcr.io/antiv/mate for every release tag, so running MATE
# in Docker no longer needs a clone and a local build. Separate from release.yml:
# a failed image build must not block the GitHub release, and the other way round.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    # arm64 is built under QEMU, which makes the Playwright and dependency layers slow.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # v1.5.0 → 1.5.0, 1.5 and latest; a manual run on a branch → the branch name.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      # Build for this runner only and start it before anything is pushed: the image
      # must come up and answer /health, which covers migrations and server start.
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: mate:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name mate -p 8000:8000 -e AUTH_PASSWORD=smoke-test mate:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo; echo "Up after $((i * 3))s"; docker rm -f mate >/dev/null; exit 0
            fi
            sleep 3
          done
          echo "::error::The container did not answer /health within 180s"
          docker logs mate
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
