name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Playwright browser binaries are intentionally not installed: the tests that
      # need a real browser skip themselves, and downloading Chromium would add
      # minutes per run.
      - name: Run tests
        run: python -m unittest discover -s shared/test -p "test_*.py" -v

      # test_sessions_api.py is pytest-native (fixtures + bare test functions), so
      # unittest imports it but collects nothing from it.
      - name: Run pytest-native tests
        run: python -m pytest shared/test/test_sessions_api.py -v
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the drift check compares against the merge base

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No dependencies to install: gen_docs.py is static analysis on stdlib only.
      - name: Reference is current and guides are well-formed
        run: python scripts/gen_docs.py --check

      # Warnings, not a failure: a code change does not always need a guide change.
      - name: Guides whose covered code changed
        if: github.event_name == 'pull_request'
        run: python scripts/gen_docs.py drift --base "origin/${{ github.base_ref }}"
