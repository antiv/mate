{# The versions of an agent and the diff of the one selected (static/js/modals/version-history.js):
   in the version history dialog, and in the Versions tab of the agent page #}
<!-- Body: two-pane layout -->
<div class="flex flex-1 overflow-hidden">
    <!-- Left: version list -->
    <div class="w-[280px] border-r border-gray-200 dark:border-gray-700 flex flex-col overflow-hidden">
        <div class="px-3 py-2 border-b border-gray-200 dark:border-gray-700 text-xs font-medium text-gray-500 dark:text-gray-400 flex items-center justify-between">
            <span>Versions</span>
            <span id="vhVersionCount" class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
        </div>
        <div id="vhVersionList" class="flex-1 overflow-y-auto"></div>
    </div>
    <!-- Right: diff viewer -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <div class="px-3 py-2 border-b border-gray-200 dark:border-gray-700 text-xs font-medium text-gray-500 dark:text-gray-400 flex items-center justify-between">
            <span id="vhDiffTitle">Select a version to view changes</span>
            <div id="vhDiffActions" class="hidden flex items-center space-x-1">
                <button id="vhRunEvalsBtn" data-click="_vhRunEvals" class="px-2 py-1 text-xs bg-green-600 hover:bg-green-700 text-white rounded flex items-center">
                    <i class="fas fa-flask mr-1"></i>Run Evals
                </button>
                <button id="vhRollbackBtn" data-click="rollbackToVersion" class="px-2 py-1 text-xs bg-orange-600 hover:bg-orange-700 text-white rounded flex items-center">
                    <i class="fas fa-undo mr-1"></i>Rollback
                </button>
            </div>
        </div>
        <div id="vhDiffContainer" class="flex-1 overflow-hidden"></div>
        <div id="vhEvalsResult" class="hidden px-3 py-2 border-t border-gray-200 dark:border-gray-700 text-xs"></div>
    </div>
</div>
